name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Подготовка файлов
        run: |
          mkdir -p www assets
          [ -f www/index.html ] || { [ -f index.html ] && cp index.html www/index.html; }
          for f in icon-only icon-foreground icon-background splash splash-dark; do [ -f assets/$f.png ] || { [ -f $f.png ] && cp $f.png assets/$f.png; }; done
          test -f www/index.html || { echo "::error::Не найден index.html. Загрузите файл index.html в корень репозитория."; exit 1; }
          test -f assets/icon-only.png || { echo "::error::Не найдены иконки (icon-only.png и остальные png). Загрузите их в корень репозитория."; exit 1; }
          ls -la www assets
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: Разрешения для уведомлений
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n</manifest>#' "$M"
      - name: Фиксированный масштаб текста (системный размер шрифта не ломает вёрстку)
        run: |
          D=android/app/src/main/java/com/dela/tasktracker
          mkdir -p "$D"
          cat > "$D/MainActivity.java" <<'JAVA'
          package com.dela.tasktracker;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onResume() {
              super.onResume();
              if (getBridge() != null && getBridge().getWebView() != null) {
                getBridge().getWebView().getSettings().setTextZoom(100);
              }
            }
          }
          JAVA
      - name: Постоянная подпись (новые сборки ставятся поверх старых)
        run: |
          if [ -f debug.keystore ]; then mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore; fi
      - run: npm run assets
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dela-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
